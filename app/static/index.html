<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UNG-KINGSHIP R3</title><style>
*{box-sizing:border-box}body{margin:0;background:#070b10;color:#dce6ee;font:14px Arial;min-width:1100px}header{height:62px;display:flex;align-items:center;gap:18px;padding:0 22px;background:#0b1118;border-bottom:1px solid #26313b}.brand{font-weight:800;letter-spacing:2px}.pill,button,input,select{border:1px solid #344451;background:#101820;color:#dce6ee;border-radius:5px;padding:7px 9px}.clock{margin-left:auto}.layout{display:grid;grid-template-columns:190px 1fr 290px;grid-template-rows:calc(100vh - 220px) 158px;gap:1px;background:#26313b}nav,.main,.side,.timeline{background:#091017}.nav{padding:15px 18px;border-bottom:1px solid #202b35;cursor:pointer}.nav.active{background:#15202a;font-weight:700}.main{position:relative;overflow:auto;padding:18px}.map{position:absolute;inset:0;background-image:linear-gradient(#14232c55 1px,transparent 1px),linear-gradient(90deg,#14232c55 1px,transparent 1px);background-size:42px 42px}.title{font-size:11px;letter-spacing:2px;margin-bottom:15px}.track{position:absolute;width:14px;height:14px;border:2px solid #e8f0f5;transform:rotate(45deg);transition:.5s}.track:after{content:attr(data-id);position:absolute;transform:rotate(-45deg);left:13px;top:-14px;font-size:10px;white-space:nowrap}.side{padding:13px;overflow:auto}.panel{border:1px solid #293743;padding:11px;margin-bottom:10px}.panel h3,.timeline h3{font-size:11px;letter-spacing:1.4px;margin:0 0 8px}.row{padding:7px 0;border-top:1px solid #1d2932;display:flex;justify-content:space-between;font-size:12px;cursor:pointer}.timeline{grid-column:1/4;padding:12px 20px;overflow:auto}.event{font:11px monospace;padding:3px}.view{display:none}.view.active{display:block}.card{border:1px solid #293743;padding:12px;margin:8px 0}.controls{display:flex;gap:8px;flex-wrap:wrap}.banner{display:none;position:fixed;top:62px;left:0;right:0;text-align:center;padding:7px;background:#222;z-index:9;font-weight:800}</style></head><body>
<header><b class="brand">UNG-KINGSHIP</b><span class="pill">TRAINING</span><span class="pill">R3</span><span class="pill" id="wan">WAN ONLINE</span><span class="pill">JANUS ✓</span><span class="clock" id="clock"></span></header><div id="banner" class="banner">LOCAL FACILITY MODE — CENTRAL HUB UNAVAILABLE</div>
<div class="layout"><nav id="nav"></nav><main class="main"><div id="COMMAND MAP" class="view active"><div class="map" id="map"><div style="position:absolute;top:18px;left:20px" class="title">COMMON OPERATING PICTURE</div></div></div><div id="content"></div></main><aside class="side"><div class="panel"><h3>SITUATIONS</h3><div id="sit"></div></div><div class="panel"><h3>SENSOR HEALTH</h3><div id="sen"></div></div><div class="panel"><h3>UNG INTEGRATION</h3><div id="sys"></div></div></aside><section class="timeline"><h3>LIVE EVENT TIMELINE</h3><div id="events"></div></section></div>
<script>
const $=s=>document.querySelector(s),pages=["COMMAND MAP","SITUATIONS","INCIDENTS","TRACKS","SENSORS","SYSTEMS","REPLAY / TRAINING"];let current="COMMAND MAP";$("#nav").innerHTML=pages.map((x,i)=>'<div class="nav '+(i?'':'active')+'" data-p="'+x+'">'+x+'</div>').join("");setInterval(()=>$("#clock").textContent=new Date().toLocaleTimeString(),1000);
document.querySelectorAll(".nav").forEach(n=>n.onclick=()=>{document.querySelectorAll(".nav").forEach(x=>x.classList.remove("active"));n.classList.add("active");current=n.dataset.p;render()});
async function api(u,o){let r=await fetch(u,o);return r.json()}function log(t,p){let e=document.createElement("div");e.className="event";e.textContent=new Date().toLocaleTimeString()+"  "+t+"  "+(p?.track_id||p?.situation_id||p?.sensor_id||p?.id||"");$("#events").prepend(e)}
function putTrack(t){let e=document.getElementById("x-"+t.track_id);if(!e){e=document.createElement("div");e.id="x-"+t.track_id;e.className="track";e.dataset.id=t.track_id;$("#map").appendChild(e)}e.style.left=t.position.x+"%";e.style.top=t.position.y+"%";e.style.opacity=t.state==="DEGRADED"?.4:1}
async function sidebar(){let[s,se,sy]=await Promise.all([api("/api/v1/situations"),api("/api/v1/sensors"),api("/api/v1/systems")]);$("#sit").innerHTML=s.slice(-5).reverse().map(x=>'<div class="row"><span>'+x.situation_id+'</span><b>'+x.severity+'</b></div>').join("")||'<div class="row">No situations</div>';$("#sen").innerHTML=se.map(x=>'<div class="row"><span>'+x.sensor_id+'</span><b>'+x.health+'</b></div>').join("");$("#sys").innerHTML=Object.entries(sy).map(x=>'<div class="row"><span>'+x[0]+'</span><b>'+x[1]+'</b></div>').join("")}
async function render(){let c=$("#content");if(current==="COMMAND MAP"){c.innerHTML="";return}let endpoint=current==="SITUATIONS"?"/api/v1/situations":current==="INCIDENTS"?"/api/v1/incidents":current==="TRACKS"?"/api/v1/tracks":current==="SENSORS"?"/api/v1/sensors":current==="SYSTEMS"?"/api/v1/health/dependencies":null;if(endpoint){let d=await api(endpoint);c.innerHTML='<div class="title">'+current+'</div><pre class="card">'+JSON.stringify(d,null,2)+'</pre>'}else c.innerHTML='<div class="title">REPLAY / TRAINING</div><div class="card"><div class="controls"><button onclick="sim(\'PAUSE\')">PAUSE</button><button onclick="sim(\'RESUME\')">RESUME</button><button onclick="sim(\'SPEED\',1)">FAST</button><button onclick="sim(\'SPEED\',3)">NORMAL</button><button onclick="sim(\'RESET\')">RESET</button><button onclick="sim(\'INJECT\')">INJECT SENSOR OUTAGE</button></div></div>'}
async function sim(action,speed){await api("/api/v1/simulation/control",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({action,speed,event_type:"SENSOR_OUTAGE"})});log("SIMULATION_"+action,{})}
async function init(){let t=await api("/api/v1/tracks");t.forEach(putTrack);await sidebar()}function connect(){let w=new WebSocket((location.protocol==="https:"?"wss://":"ws://")+location.host+"/ws/v1/operations");w.onopen=()=>{$("#banner").style.display="none";$("#wan").textContent="WAN ONLINE"};w.onmessage=e=>{let m=JSON.parse(e.data);log(m.message_type,m.payload);if(m.message_type==="TRACK_UPDATED")putTrack(m.payload);if(/SITUATION|SENSOR/.test(m.message_type))sidebar();if(current!=="COMMAND MAP")render()};w.onclose=()=>{$("#banner").style.display="block";$("#wan").textContent="WAN DEGRADED";setTimeout(connect,2000)}}init();connect();
</script></body></html>
